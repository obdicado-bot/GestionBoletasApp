  <!-- Modulos de la aplicacion (todo en un solo archivo) -->
  <script>
/* ==========================================================================
   storage.js — Capa de persistencia sobre LocalStorage
   Actúa como "base de datos" de la aplicación.

   Modelo: una FECHA puede tener varios GRUPOS de boletas (lotes generados
   por separado, ej. "Grupo 1", "Grupo 2"). Cada boleta pertenece a un grupo
   y su número (Boleta 1, 2, 3…) es propio de ese grupo.
   ========================================================================== */

const DB = (() => {
  const KEYS = {
    SESSION: 'boletas_app_session',
    BOLETAS: 'boletas_app_boletas',
    GRUPOS: 'boletas_app_grupos',
    CONFIG: 'boletas_app_config',
    REPORTES: 'boletas_app_reportes'
  };

  const DEFAULT_CONFIG = {
    passwordAdmin: 'Harold.2027',
    passwordEmpleado: 'Tesalia.2026',
    empleadoPuedeDescargarPDF: false,
    sharepointUrl: 'https://defaulte9193073ba8b4e388647ba66872708.21.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/39b419341e8e47b79dd96129c708315f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=c62DlfxzOjBi1BaDWySno5aldFYMP91rx66QNXckY9Y',
    sincronizarSharepoint: true
  };

  /* ---------- utilidades internas ---------- */
  function read(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.error('Error leyendo LocalStorage', key, e);
      return fallback;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('Error escribiendo LocalStorage', key, e);
      return false;
    }
  }

  function uid() {
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }

  function todayISO() {
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  /* ---------- SESIÓN ---------- */
  function getSession() {
    return read(KEYS.SESSION, null);
  }

  function setSession(session) {
    return write(KEYS.SESSION, session);
  }

  function clearSession() {
    localStorage.removeItem(KEYS.SESSION);
  }

  /* ---------- CONFIGURACIÓN ---------- */
  function getConfig() {
    return read(KEYS.CONFIG, DEFAULT_CONFIG);
  }

  function setConfig(cfg) {
    return write(KEYS.CONFIG, { ...getConfig(), ...cfg });
  }

  /* ---------- BOLETAS (bajo nivel) ---------- */
  function getBoletas() {
    return read(KEYS.BOLETAS, []);
  }

  function saveBoletas(list) {
    return write(KEYS.BOLETAS, list);
  }

  function getBoletasPorFecha(fecha) {
    return getBoletas().filter(b => b.fecha === fecha);
  }

  function getBoletasPorGrupo(grupoId) {
    return getBoletas().filter(b => b.grupoId === grupoId);
  }

  function getBoleta(id) {
    return getBoletas().find(b => b.id === id) || null;
  }

  function calcularEstado(fotos) {
    const llenas = fotos.filter(f => f !== null && f !== undefined).length;
    if (llenas === fotos.length && fotos.length > 0) return 'completa';
    if (llenas === 0) return 'sin-registro';
    return 'incompleta';
  }

  function contarFotos(fotos) {
    return fotos.filter(f => f !== null && f !== undefined).length;
  }

  /* ---------- GRUPOS ---------- */
  function getGrupos() {
    return read(KEYS.GRUPOS, []);
  }

  function saveGrupos(list) {
    return write(KEYS.GRUPOS, list);
  }

  function getGrupo(id) {
    return getGrupos().find(g => g.id === id) || null;
  }

  function getGruposPorFecha(fecha) {
    return getGrupos()
      .filter(g => g.fecha === fecha)
      .sort((a, b) => new Date(a.creado) - new Date(b.creado));
  }

  function getFechasDisponibles() {
    const set = new Set(getGrupos().map(g => g.fecha));
    return Array.from(set).sort().reverse();
  }

  function siguienteNombreGrupo(fecha) {
    const existentes = getGruposPorFecha(fecha);
    return `Grupo ${existentes.length + 1}`;
  }

  /** Genera `cantidad` códigos consecutivos a partir de un código inicial
   * (numérico, de cualquier longitud). Si el código inicial no es válido
   * o no se proporcionó, devuelve un arreglo de `null` (sin código —
   * el código es siempre opcional). */
  function generarSecuenciaCodigos(codigoInicial, cantidad) {
    const limpio = (codigoInicial || '').toString().trim();
    if (!limpio || !/^\d+$/.test(limpio)) return Array(cantidad).fill(null);
    try {
      const base = BigInt(limpio);
      const resultado = [];
      for (let i = 0; i < cantidad; i++) resultado.push((base + BigInt(i)).toString());
      return resultado;
    } catch (e) {
      return Array(cantidad).fill(null);
    }
  }

  /** Calcula el código que le tocaría a la boleta número `numero`, si se
   * conoce el código de otra boleta de referencia del mismo grupo (sigue
   * la misma secuencia numérica consecutiva). Devuelve null si la boleta
   * de referencia no tiene código válido. */
  function calcularCodigoSiguiente(boletaReferencia, numero) {
    if (!boletaReferencia || !boletaReferencia.codigo || !/^\d+$/.test(boletaReferencia.codigo)) return null;
    try {
      return (BigInt(boletaReferencia.codigo) + BigInt(numero - boletaReferencia.numero)).toString();
    } catch (e) {
      return null;
    }
  }

  /** Crea un nuevo grupo (lote) de boletas para una fecha. Si la fecha ya
   * tiene grupos, este se agrega como uno más (no reemplaza a los otros).
   * `codigoInicial` es opcional: si se indica, cada boleta recibe el
   * siguiente código consecutivo automáticamente. */
  function crearGrupo(fecha, cantidad, codigoInicial) {
    const grupos = getGrupos();
    const grupo = {
      id: uid(),
      fecha,
      nombre: siguienteNombreGrupo(fecha),
      creado: new Date().toISOString(),
      cerrado: false,
      cerradoEn: null,
      ultimoReporteId: null,
      visibleEmpleado: true
    };
    grupos.push(grupo);
    saveGrupos(grupos);

    const codigos = generarSecuenciaCodigos(codigoInicial, cantidad);
    const boletas = getBoletas();
    const nuevas = [];
    for (let i = 1; i <= cantidad; i++) {
      nuevas.push({
        id: uid(),
        grupoId: grupo.id,
        numero: i,
        codigo: codigos[i - 1] || null,
        fecha,
        fotos: [null, null, null],
        estado: 'sin-registro',
        creada: new Date().toISOString(),
        actualizada: null
      });
    }
    saveBoletas([...boletas, ...nuevas]);
    return { grupo, boletas: nuevas };
  }

  /** Ajusta la cantidad de boletas de un grupo ya existente: agrega al final
   * si se pide más, o quita las de número más alto si se pide menos. Si las
   * boletas ya tenían códigos consecutivos, las nuevas continúan esa misma
   * secuencia automáticamente. */
  function ajustarCantidadGrupo(grupoId, nuevaCantidad) {
    const grupo = getGrupo(grupoId);
    if (!grupo) return { ok: false };

    const boletas = getBoletas();
    const deOtros = boletas.filter(b => b.grupoId !== grupoId);
    let delGrupo = boletas.filter(b => b.grupoId === grupoId).sort((a, b) => a.numero - b.numero);
    const actual = delGrupo.length;

    let agregadas = 0;
    let eliminadas = 0;

    if (nuevaCantidad > actual) {
      const referencia = delGrupo[delGrupo.length - 1] || null;
      for (let i = actual + 1; i <= nuevaCantidad; i++) {
        delGrupo.push({
          id: uid(),
          grupoId,
          numero: i,
          codigo: calcularCodigoSiguiente(referencia, i),
          fecha: grupo.fecha,
          fotos: [null, null, null],
          estado: 'sin-registro',
          creada: new Date().toISOString(),
          actualizada: null
        });
      }
      agregadas = nuevaCantidad - actual;
    } else if (nuevaCantidad < actual) {
      eliminadas = actual - nuevaCantidad;
      delGrupo = delGrupo.slice(0, nuevaCantidad);
    }

    saveBoletas([...deOtros, ...delGrupo]);
    return { ok: true, agregadas, eliminadas, total: nuevaCantidad };
  }

  /** Agrega UNA boleta suelta al final de un grupo (por ejemplo, si se
   * olvidó una al generar el lote). Si el grupo tenía códigos consecutivos,
   * la nueva boleta continúa esa secuencia automáticamente. */
  function agregarBoletaAGrupo(grupoId) {
    const grupo = getGrupo(grupoId);
    if (!grupo) return null;
    const boletas = getBoletas();
    const delGrupo = boletas.filter(b => b.grupoId === grupoId).sort((a, b) => a.numero - b.numero);
    const siguienteNumero = delGrupo.length > 0
      ? Math.max(...delGrupo.map(b => b.numero)) + 1
      : 1;
    const referencia = delGrupo[delGrupo.length - 1] || null;
    const nueva = {
      id: uid(),
      grupoId,
      numero: siguienteNumero,
      codigo: calcularCodigoSiguiente(referencia, siguienteNumero),
      fecha: grupo.fecha,
      fotos: [null, null, null],
      estado: 'sin-registro',
      creada: new Date().toISOString(),
      actualizada: null
    };
    saveBoletas([...boletas, nueva]);
    return nueva;
  }

  /** Boletas que se eliminarían si se reduce un grupo a `nuevaCantidad`
   * (las de número más alto). Sirve para advertir antes de confirmar. */
  function previsualizarEliminacionGrupo(grupoId, nuevaCantidad) {
    const delGrupo = getBoletasPorGrupo(grupoId).sort((a, b) => a.numero - b.numero);
    if (nuevaCantidad >= delGrupo.length) return [];
    return delGrupo.slice(nuevaCantidad);
  }

  function eliminarGrupo(grupoId) {
    saveGrupos(getGrupos().filter(g => g.id !== grupoId));
    saveBoletas(getBoletas().filter(b => b.grupoId !== grupoId));
  }

  function marcarGrupoCerrado(grupoId, reporteId) {
    const grupos = getGrupos();
    const idx = grupos.findIndex(g => g.id === grupoId);
    if (idx === -1) return;
    // Al cerrar la jornada, el grupo deja de estar disponible para que el
    // empleado siga registrando fotos, salvo que el administrador lo
    // vuelva a habilitar manualmente con setVisibilidadGrupo().
    grupos[idx] = { ...grupos[idx], cerrado: true, cerradoEn: new Date().toISOString(), ultimoReporteId: reporteId, visibleEmpleado: false };
    saveGrupos(grupos);
  }

  /** Muestra u oculta manualmente un grupo para los empleados, sin importar
   * si está cerrado o no. Le da al administrador control total: puede dejar
   * seguir editando un grupo ya cerrado, u ocultar uno que sigue abierto. */
  function setVisibilidadGrupo(grupoId, visible) {
    const grupos = getGrupos();
    const idx = grupos.findIndex(g => g.id === grupoId);
    if (idx === -1) return;
    grupos[idx] = { ...grupos[idx], visibleEmpleado: !!visible };
    saveGrupos(grupos);
  }

  /** Reabre una jornada ya cerrada: vuelve a marcar el grupo como abierto
   * y lo hace visible/editable para los colaboradores otra vez (el
   * administrador puede volver a ocultarlo después con setVisibilidadGrupo
   * si lo prefiere). El reporte que ya se generó al cerrar no se borra del
   * historial, así que ese cierre anterior sigue disponible como registro. */
  function reabrirGrupo(grupoId) {
    const grupos = getGrupos();
    const idx = grupos.findIndex(g => g.id === grupoId);
    if (idx === -1) return;
    grupos[idx] = { ...grupos[idx], cerrado: false, cerradoEn: null, visibleEmpleado: true };
    saveGrupos(grupos);
  }

  /* ---------- BOLETAS (edición) ---------- */
  function actualizarFotos(id, fotos) {
    const boletas = getBoletas();
    const idx = boletas.findIndex(b => b.id === id);
    if (idx === -1) return { ok: false, motivo: 'no-encontrada', boleta: null };

    const respaldo = boletas[idx];
    const actualizada = {
      ...respaldo,
      fotos: fotos,
      estado: calcularEstado(fotos),
      actualizada: new Date().toISOString()
    };
    boletas[idx] = actualizada;

    const guardadoOk = saveBoletas(boletas);
    if (!guardadoOk) {
      // No se pudo persistir (por ejemplo, LocalStorage lleno):
      // se informa el fallo en lugar de reportar un guardado falso.
      return { ok: false, motivo: 'almacenamiento-lleno', boleta: respaldo };
    }
    return { ok: true, motivo: null, boleta: actualizada };
  }

  /** Actualiza (o borra, si se manda vacío) el código de una boleta puntual.
   * Tanto el administrador como el colaborador pueden usar esto — el código
   * es siempre opcional y editable en cualquier momento. */
  function actualizarCodigo(id, codigo) {
    const boletas = getBoletas();
    const idx = boletas.findIndex(b => b.id === id);
    if (idx === -1) return { ok: false, motivo: 'no-encontrada' };
    const limpio = (codigo || '').toString().trim();
    boletas[idx] = { ...boletas[idx], codigo: limpio || null, actualizada: new Date().toISOString() };
    const guardadoOk = saveBoletas(boletas);
    if (!guardadoOk) return { ok: false, motivo: 'almacenamiento-lleno' };
    return { ok: true, boleta: boletas[idx] };
  }

  function eliminarBoleta(id) {
    const boletas = getBoletas().filter(b => b.id !== id);
    saveBoletas(boletas);
  }

  /* ---------- REPORTES (histórico) ---------- */
  function getReportes() {
    return read(KEYS.REPORTES, []);
  }

  function guardarReporte(reporte) {
    const reportes = getReportes();
    reportes.unshift(reporte);
    // Solo se conservan los últimos 3 reportes (eficiencia de espacio);
    // el administrador también puede borrar alguno manualmente antes.
    write(KEYS.REPORTES, reportes.slice(0, 3));
    return reporte;
  }

  function eliminarReporte(id) {
    const reportes = getReportes().filter(r => r.id !== id);
    write(KEYS.REPORTES, reportes);
  }

  /* ---------- MIGRACIÓN (versiones anteriores sin grupos) ---------- */
  function migrarEstructura() {
    const boletas = getBoletas();
    const sinGrupo = boletas.filter(b => !b.grupoId);
    if (sinGrupo.length === 0) return;

    const grupos = getGrupos();
    const fechas = Array.from(new Set(sinGrupo.map(b => b.fecha)));
    const actualizadas = [...boletas];

    fechas.forEach(fecha => {
      const grupo = {
        id: uid(),
        fecha,
        nombre: 'Grupo 1',
        creado: new Date().toISOString(),
        cerrado: false,
        cerradoEn: null,
        ultimoReporteId: null,
        visibleEmpleado: true
      };
      grupos.push(grupo);
      actualizadas.forEach(b => {
        if (!b.grupoId && b.fecha === fecha) b.grupoId = grupo.id;
      });
    });

    saveGrupos(grupos);
    saveBoletas(actualizadas);
  }

  /* ---------- SEED (datos de ejemplo la primera vez) ---------- */
  function seedIfEmpty() {
    migrarEstructura();
    const grupos = getGrupos();
    if (grupos.length === 0) {
      crearGrupo(todayISO(), 12);
    }
  }

  return {
    KEYS,
    uid,
    todayISO,
    getSession, setSession, clearSession,
    getConfig, setConfig,
    getBoletas, saveBoletas, getBoletasPorFecha, getBoletasPorGrupo, getBoleta,
    calcularEstado, contarFotos,
    getGrupos, getGrupo, getGruposPorFecha, siguienteNombreGrupo,
    crearGrupo, ajustarCantidadGrupo, agregarBoletaAGrupo,
    previsualizarEliminacionGrupo, eliminarGrupo, marcarGrupoCerrado, setVisibilidadGrupo, reabrirGrupo,
    actualizarFotos, eliminarBoleta, actualizarCodigo,
    getFechasDisponibles,
    getReportes, guardarReporte, eliminarReporte,
    migrarEstructura,
    seedIfEmpty
  };
})();

/* ===========================================================================
   PhotoStore — binarios de fotos en IndexedDB; almacenamiento principal ligero
   ========================================================================== */
const PhotoStore = (() => {
  const DB_NAME = 'control_boletas_fotos';
  const STORE = 'fotos';
  let databasePromise;

  function open() {
    if (databasePromise) return databasePromise;
    databasePromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = () => {
        const store = request.result.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('boletaId', 'boletaId', { unique: false });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('No se pudo abrir IndexedDB.'));
    });
    return databasePromise;
  }

  async function transaction(mode, action) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, mode);
      const request = action(tx.objectStore(STORE));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Error al acceder a las fotografías.'));
    });
  }

  async function put({ id, boletaId, name, blob }) {
    await transaction('readwrite', store => store.put({ id, boletaId, name, blob, updatedAt: Date.now() }));
    return { id, name };
  }
  const get = id => transaction('readonly', store => store.get(id));
  const remove = id => transaction('readwrite', store => store.delete(id));
  const clear = () => transaction('readwrite', store => store.clear());
  const removeBoleta = async boletaId => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const request = tx.objectStore(STORE).index('boletaId').openCursor(IDBKeyRange.only(boletaId));
      request.onsuccess = () => { const cursor = request.result; if (cursor) { cursor.delete(); cursor.continue(); } };
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('No se pudieron eliminar las fotografías.'));
    });
  };
  const metadata = foto => foto ? { id: foto.id, name: foto.name } : null;
  const blobToDataURL = blob => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('No se pudo leer la fotografía.'));
    reader.readAsDataURL(blob);
  });
  async function dataURL(id) { const record = await get(id); return record?.blob ? blobToDataURL(record.blob) : null; }
  async function preview(meta) {
    if (!meta?.id) return null;
    const record = await get(meta.id);
    return record?.blob ? { ...meta, data: URL.createObjectURL(record.blob) } : null;
  }
  async function migrarFotosAntiguas() {
    const boletas = DB.getBoletas();
    let cambios = false;
    for (const boleta of boletas) {
      for (let indice = 0; indice < boleta.fotos.length; indice++) {
        const foto = boleta.fotos[indice];
        if (!foto?.data?.startsWith('data:image/')) continue;
        const id = `foto-${boleta.id}-${indice}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const blob = await (await fetch(foto.data)).blob();
        await put({ id, boletaId: boleta.id, name: foto.name || `foto-${indice + 1}.jpg`, blob });
        boleta.fotos[indice] = { id, name: foto.name || `foto-${indice + 1}.jpg` };
        cambios = true;
      }
    }
    if (cambios) DB.saveBoletas(boletas);
  }
  return { open, put, get, remove, clear, removeBoleta, metadata, dataURL, preview, migrarFotosAntiguas };
})();


/* ==========================================================================
   sharepointSync.js — Envío de boletas (datos + fotos) a un flujo de
   Power Automate, para que las guarde en una lista de SharePoint.
   ========================================================================== */

const SharePointSync = (() => {
  const ESTADO_LABEL = {
    'completa': 'Completa',
    'incompleta': 'Información incompleta',
    'sin-registro': 'Sin registro'
  };

  async function construirPayload(boleta) {
    const fotosNoVacias = boleta.fotos.filter(Boolean);
    const fotos = [];
    for (let i = 0; i < fotosNoVacias.length; i++) {
      const f = fotosNoVacias[i];
      try {
        const dataUrl = await PhotoStore.dataURL(f.id);
        if (!dataUrl) continue;
        fotos.push({
          Nombre: f.name || `boleta-${boleta.numero}-foto${i + 1}.jpg`,
          ContenidoBase64: dataUrl.split(',')[1] || ''
        });
      } catch (error) {
        console.error('No se pudo leer una fotografía para enviarla a SharePoint', error);
      }
    }
    return {
      NumeroBoleta: boleta.codigo || `Boleta ${boleta.numero}`,
      Fecha: boleta.fecha,
      Estado: ESTADO_LABEL[boleta.estado] || boleta.estado,
      CantidadFotos: fotos.length,
      Fotos: fotos
    };
  }

  async function enviarPayload(payload) {
    const cfg = DB.getConfig();
    if (!cfg.sharepointUrl) return { ok: false, motivo: 'sin-url' };
    try {
      const respuesta = await fetch(cfg.sharepointUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!respuesta.ok) return { ok: false, motivo: 'http-' + respuesta.status };
      return { ok: true };
    } catch (error) {
      console.error('Error al enviar información a Power Automate/SharePoint', error);
      return { ok: false, motivo: 'red' };
    }
  }

  async function enviarBoleta(boleta) {
    const payload = await construirPayload(boleta);
    return enviarPayload(payload);
  }

  async function enviarGrupo(grupoId, { onProgreso } = {}) {
    const cfg = DB.getConfig();
    if (!cfg.sharepointUrl) return { enviadas: 0, fallidas: 0, total: 0, sinUrl: true };
    const boletas = DB.getBoletasPorGrupo(grupoId).sort((a, b) => a.numero - b.numero);
    let enviadas = 0, fallidas = 0;
    for (let i = 0; i < boletas.length; i++) {
      const resultado = await enviarBoleta(boletas[i]);
      if (resultado.ok) enviadas++; else fallidas++;
      if (onProgreso) onProgreso(i + 1, boletas.length);
    }
    return { enviadas, fallidas, total: boletas.length, sinUrl: false };
  }

  async function probarConexion() {
    return enviarPayload({
      NumeroBoleta: 'PRUEBA-CONEXION',
      Fecha: DB.todayISO(),
      Estado: 'Completa',
      CantidadFotos: 0,
      Fotos: []
    });
  }

  return { enviarBoleta, enviarGrupo, probarConexion };
})();


/* ==========================================================================
   ui.js — Toasts, modales, loader y utilidades de interfaz
   ========================================================================== */

const UI = (() => {

  /* ---------- LOADER ---------- */
  let loaderEl = null;
  let loaderTimer = null;

  function showLoader(texto = 'Cargando…') {
    if (!loaderEl) loaderEl = document.getElementById('global-loader');
    if (!loaderEl) return;
    loaderEl.querySelector('.loader-text').textContent = texto;
    loaderEl.classList.add('is-visible');
  }

  function hideLoader() {
    if (!loaderEl) loaderEl = document.getElementById('global-loader');
    if (!loaderEl) return;
    loaderEl.classList.remove('is-visible');
  }

  function withLoader(texto, fn) {
    showLoader(texto);
    clearTimeout(loaderTimer);
    return new Promise(resolve => {
      loaderTimer = setTimeout(async () => {
        const result = await fn();
        hideLoader();
        resolve(result);
      }, 350);
    });
  }

  /* ---------- TOASTS ---------- */
  function toastContainer() {
    let el = document.getElementById('toast-container');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast-container';
      el.className = 'toast-container';
      document.body.appendChild(el);
    }
    return el;
  }

  const ICONS = {
    success: '<svg viewBox="0 0 20 20" fill="none"><path d="M6 10.5l2.5 2.5L14 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    error: '<svg viewBox="0 0 20 20" fill="none"><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    warning: '<svg viewBox="0 0 20 20" fill="none"><path d="M10 7.5v4M10 14h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.6 3.6L1.9 15a1.6 1.6 0 001.4 2.4h13.4a1.6 1.6 0 001.4-2.4L11.4 3.6a1.6 1.6 0 00-2.8 0z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    info: '<svg viewBox="0 0 20 20" fill="none"><path d="M10 9v5M10 6.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/></svg>'
  };

  function toast(mensaje, tipo = 'info', duracion = 3800) {
    const container = toastContainer();
    const el = document.createElement('div');
    el.className = `toast toast--${tipo}`;
    el.innerHTML = `
      <span class="toast-icon">${ICONS[tipo] || ICONS.info}</span>
      <span class="toast-msg">${mensaje}</span>
      <button class="toast-close" aria-label="Cerrar">&times;</button>
    `;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-visible'));

    const remove = () => {
      el.classList.remove('is-visible');
      setTimeout(() => el.remove(), 260);
    };
    el.querySelector('.toast-close').addEventListener('click', remove);
    const timer = setTimeout(remove, duracion);
    el.addEventListener('mouseenter', () => clearTimeout(timer));
    return el;
  }

  /* ---------- MODAL genérico (con soporte de apilado) ---------- */
  let modalStack = [];
  let modalZBase = 10000;

  function openModal({ title, bodyHTML, footerHTML, size = 'md', onClose, onBeforeClose }) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = String(modalZBase + modalStack.length * 2);
    overlay.innerHTML = `
      <div class="modal modal--${size}" role="dialog" aria-modal="true">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" aria-label="Cerrar">
            <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
        ${footerHTML ? `<div class="modal-footer">${footerHTML}</div>` : ''}
      </div>
    `;
    document.body.appendChild(overlay);
    document.body.classList.add('no-scroll');
    requestAnimationFrame(() => overlay.classList.add('is-visible'));

    const entry = {};
    modalStack.push(entry);

    const escHandler = (e) => {
      if (e.key === 'Escape' && modalStack[modalStack.length - 1] === entry) requestClose();
    };
    document.addEventListener('keydown', escHandler);

    // close() cierra el modal de forma incondicional (uso programático,
    // por ejemplo tras completar una acción explícita).
    const close = () => {
      overlay.classList.remove('is-visible');
      setTimeout(() => {
        overlay.remove();
        document.removeEventListener('keydown', escHandler);
        modalStack = modalStack.filter(e => e !== entry);
        if (modalStack.length === 0) document.body.classList.remove('no-scroll');
        if (onClose) onClose();
      }, 200);
    };
    entry.close = close;

    // requestClose() es la vía "interactiva" (X, click fuera, tecla Esc):
    // si se definió onBeforeClose, se le consulta antes de cerrar de verdad,
    // lo que permite advertir al usuario si hay una carga en curso. Un modal
    // abierto encima (por ejemplo un diálogo de confirmación) no destruye
    // este modal: ambos conviven apilados hasta que cada uno se cierra.
    const requestClose = async () => {
      if (onBeforeClose) {
        const permitido = await onBeforeClose();
        if (!permitido) return;
      }
      close();
    };

    overlay.querySelector('.modal-close').addEventListener('click', requestClose);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) requestClose(); });

    return { overlay, close, requestClose };
  }

  function closeModal() {
    modalStack.slice().forEach(entry => entry.close());
  }

  function confirmDialog({ title = 'Confirmar', message, confirmText = 'Confirmar', cancelText = 'Cancelar', danger = false }) {
    return new Promise(resolve => {
      const footer = `
        <button class="btn btn-ghost" data-action="cancel">${cancelText}</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-action="confirm">${confirmText}</button>
      `;
      const { overlay, close } = openModal({
        title,
        bodyHTML: `<p class="confirm-message">${message}</p>`,
        footerHTML: footer,
        size: 'sm'
      });
      overlay.querySelector('[data-action="cancel"]').addEventListener('click', () => { close(); resolve(false); });
      overlay.querySelector('[data-action="confirm"]').addEventListener('click', () => { close(); resolve(true); });
    });
  }

  /* ---------- efecto decorativo: burbujas 3D (estilo agua mineral) ---------- */
  function bubbleFieldHTML() {
    const burbujas = [
      { size: 14, left: 6,  duration: 9.5,  delay: 0,   drift: 16 },
      { size: 24, left: 16, duration: 12.5, delay: 1.4, drift: -12 },
      { size: 9,  left: 27, duration: 7.5,  delay: 3.1, drift: 10 },
      { size: 32, left: 37, duration: 15,   delay: 0.6, drift: -18 },
      { size: 12, left: 49, duration: 8.5,  delay: 2.3, drift: 12 },
      { size: 19, left: 60, duration: 11.5, delay: 4.2, drift: -9 },
      { size: 8,  left: 71, duration: 6.8,  delay: 1.1, drift: 13 },
      { size: 27, left: 81, duration: 13.5, delay: 3.7, drift: -15 },
      { size: 16, left: 91, duration: 9.8,  delay: 0.3, drift: 7 },
      { size: 11, left: 44, duration: 7.8,  delay: 5.2, drift: -7 },
      { size: 21, left: 12, duration: 10.8, delay: 6.1, drift: 11 },
      { size: 13, left: 66, duration: 8.2,  delay: 2.7, drift: -10 }
    ];
    const spans = burbujas.map(b => `<span class="bubble" style="left:${b.left}%;width:${b.size}px;height:${b.size}px;animation-duration:${b.duration}s;animation-delay:${b.delay}s;--drift:${b.drift}px;"></span>`).join('');
    return `<div class="bubble-field" aria-hidden="true">${spans}</div>`;
  }

  /* ---------- helpers varios ---------- */
  function formatFecha(fechaISO) {
    if (!fechaISO) return '';
    const [y, m, d] = fechaISO.split('-');
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return `${parseInt(d, 10)} ${meses[parseInt(m, 10) - 1]}. ${y}`;
  }

  function formatFechaLarga(fechaISO) {
    if (!fechaISO) return '';
    const [y, m, d] = fechaISO.split('-');
    const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return `${parseInt(d, 10)} de ${meses[parseInt(m, 10) - 1]} de ${y}`;
  }

  return {
    showLoader, hideLoader, withLoader,
    toast,
    openModal, closeModal, confirmDialog,
    bubbleFieldHTML,
    formatFecha, formatFechaLarga
  };
})();


/* ==========================================================================
   login.js — Pantalla de inicio de sesión
   ========================================================================== */

const Login = (() => {

  /* --------------------------------------------------------------------
     Fondo animado: burbujas de CO₂ ascendiendo dentro de la pantalla de
     contraseña (efecto "agua mineral / bebida carbonatada"). Autocontenido
     en este módulo: solo afecta el fondo de esta pantalla, nada más.
     -------------------------------------------------------------------- */
  const BubbleFX = (() => {
    let rafId = null;
    let resizeHandler = null;
    let visibilityHandler = null;

    // Config por capa de profundidad: lejos (pequeñas/lentas/difusas),
    // media, cerca (grandes/rápidas/nítidas y más brillantes).
    // Colores más claros y más burbujas para una sensación de agua viva.
    const CAPAS = [
      { rMin: 1.6, rMax: 4.5,  vMin: 10, vMax: 20, blur: 2.2, alphaMin: 0.14, alphaMax: 0.30, proporcion: 0.46 },
      { rMin: 4.5, rMax: 10,   vMin: 20, vMax: 36, blur: 0.7, alphaMin: 0.24, alphaMax: 0.46, proporcion: 0.35 },
      { rMin: 9,   rMax: 27,   vMin: 32, vMax: 58, blur: 0,   alphaMin: 0.36, alphaMax: 0.68, proporcion: 0.19 }
    ];
    const RADIOS_SPRITE = [2, 4, 6, 9, 13, 18, 24, 30]; // buckets para pre-renderizar

    function crearSprite(radio, blur) {
      const pad = Math.ceil(blur * 2.5) + 2;
      const size = Math.ceil((radio + pad) * 2);
      const off = document.createElement('canvas');
      off.width = size;
      off.height = size;
      const c = off.getContext('2d');
      const cx = size / 2, cy = size / 2;
      c.save();
      if (blur > 0) c.filter = `blur(${blur}px)`;
      const grad = c.createRadialGradient(cx - radio * 0.35, cy - radio * 0.38, radio * 0.05, cx, cy, radio);
      grad.addColorStop(0, 'rgba(255,255,255,0.98)');
      grad.addColorStop(0.30, 'rgba(216,248,255,0.68)');
      grad.addColorStop(0.68, 'rgba(160,224,255,0.42)');
      grad.addColorStop(1, 'rgba(132,206,255,0)');
      c.beginPath();
      c.arc(cx, cy, radio, 0, Math.PI * 2);
      c.fillStyle = grad;
      c.fill();
      c.lineWidth = Math.max(0.4, radio * 0.035);
      c.strokeStyle = 'rgba(255,255,255,0.40)';
      c.stroke();
      c.restore();
      // Brillo especular (sin difuminar, para que siempre se vea nítido).
      c.beginPath();
      c.arc(cx - radio * 0.34, cy - radio * 0.36, Math.max(0.5, radio * 0.16), 0, Math.PI * 2);
      c.fillStyle = 'rgba(255,255,255,0.95)';
      c.fill();
      return { canvas: off, radio, pad };
    }

    function construirSprites() {
      // Un set de sprites por capa (con su nivel de desenfoque horneado).
      return CAPAS.map(capa => RADIOS_SPRITE.map(r => crearSprite(r, capa.blur)));
    }

    function elegirSprite(sprites, capaIdx, radio) {
      const lista = sprites[capaIdx];
      let mejor = lista[0];
      let mejorDif = Infinity;
      for (const s of lista) {
        const dif = Math.abs(s.radio - radio);
        if (dif < mejorDif) { mejorDif = dif; mejor = s; }
      }
      return mejor;
    }

    function crearBurbuja(width, height, capaIdx) {
      const cfg = CAPAS[capaIdx];
      const r = cfg.rMin + Math.random() * (cfg.rMax - cfg.rMin);
      return {
        capa: capaIdx,
        xBase: Math.random() * width,
        y: Math.random() * (height + 200) - 100,
        r,
        vy: cfg.vMin + Math.random() * (cfg.vMax - cfg.vMin),
        driftAmp: 8 + Math.random() * 30 * (capaIdx + 1) / 3,
        driftFreq: 0.10 + Math.random() * 0.32,
        driftPhase: Math.random() * Math.PI * 2,
        alpha: cfg.alphaMin + Math.random() * (cfg.alphaMax - cfg.alphaMin)
      };
    }

    function reiniciarBurbuja(b, width, height, capaIdx) {
      const cfg = CAPAS[capaIdx];
      b.xBase = Math.random() * width;
      b.r = cfg.rMin + Math.random() * (cfg.rMax - cfg.rMin);
      b.vy = cfg.vMin + Math.random() * (cfg.vMax - cfg.vMin);
      b.driftAmp = 8 + Math.random() * 30 * (capaIdx + 1) / 3;
      b.driftFreq = 0.10 + Math.random() * 0.32;
      b.driftPhase = Math.random() * Math.PI * 2;
      b.alpha = cfg.alphaMin + Math.random() * (cfg.alphaMax - cfg.alphaMin);
      b.y = height + b.r + Math.random() * 60;
    }

    function iniciar(canvas) {
      if (!canvas || !canvas.getContext) return () => {};
      const ctx = canvas.getContext('2d');
      if (!ctx) return () => {};

      let width = 0, height = 0, dpr = 1;
      let sprites = null;
      let capasBurbujas = [];
      let ultimoTs = null;
      let activo = true;

      function medir() {
        const rect = canvas.parentElement.getBoundingClientRect();
        width = Math.max(1, Math.round(rect.width));
        height = Math.max(1, Math.round(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function poblar() {
        const area = width * height;
        let total = Math.round(area / 5500);
        total = Math.max(100, Math.min(280, total));
        capasBurbujas = CAPAS.map((cfg, idx) => {
          const cantidad = Math.max(6, Math.round(total * cfg.proporcion));
          const arr = [];
          for (let i = 0; i < cantidad; i++) arr.push(crearBurbuja(width, height, idx));
          return arr;
        });
      }

      medir();
      sprites = construirSprites();
      poblar();

      function pararTodo() {
        activo = false;
        if (rafId) cancelAnimationFrame(rafId);
        if (resizeHandler) window.removeEventListener('resize', resizeHandler);
        if (visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
      }

      function frame(ts) {
        if (!activo) return;
        // Si la pantalla de login ya no está visible (se inició sesión y
        // ahora se ve el panel principal), se detiene por completo en vez
        // de seguir animando en segundo plano sin necesidad.
        const pantalla = document.getElementById('login-screen');
        if (!pantalla || pantalla.hidden) { pararTodo(); return; }
        if (document.hidden) { rafId = requestAnimationFrame(frame); ultimoTs = ts; return; }
        if (ultimoTs === null) ultimoTs = ts;
        const dt = Math.min(0.05, (ts - ultimoTs) / 1000);
        ultimoTs = ts;

        ctx.clearRect(0, 0, width, height);

        for (let capaIdx = 0; capaIdx < capasBurbujas.length; capaIdx++) {
          const lista = capasBurbujas[capaIdx];
          for (let i = 0; i < lista.length; i++) {
            const b = lista[i];
            b.y -= b.vy * dt;
            if (b.y + b.r < -20) {
              reiniciarBurbuja(b, width, height, capaIdx);
              continue;
            }
            const x = b.xBase + Math.sin((ts / 1000) * b.driftFreq + b.driftPhase) * b.driftAmp;
            const sprite = elegirSprite(sprites, capaIdx, b.r);
            const escala = b.r / sprite.radio;
            const destSize = sprite.canvas.width * escala;
            ctx.globalAlpha = b.alpha;
            ctx.drawImage(sprite.canvas, x - destSize / 2, b.y - destSize / 2, destSize, destSize);
          }
        }
        ctx.globalAlpha = 1;

        rafId = requestAnimationFrame(frame);
      }

      rafId = requestAnimationFrame(frame);

      resizeHandler = () => {
        medir();
        poblar();
      };
      window.addEventListener('resize', resizeHandler);

      visibilityHandler = () => { ultimoTs = null; };
      document.addEventListener('visibilitychange', visibilityHandler);

      return pararTodo;
    }

    return { iniciar };
  })();

  let detenerBubbleFX = null;

  function getCredenciales() {
    const cfg = DB.getConfig();
    return {
      admin: { password: cfg.passwordAdmin, nombre: 'Administrador', rol: 'admin' },

  let perfilSeleccionado = 'admin';

  function render() {

  function wireEvents() {
    const options = document.querySelectorAll('.profile-option');
    const formWrap = document.getElementById('login-form-wrap');
    options.forEach(btn => {
      btn.addEventListener('click', () => {
        options.forEach(o => { o.classList.remove('is-active'); o.setAttribute('aria-selected', 'false'); });
        btn.classList.add('is-active');
        btn.setAttribute('aria-selected', 'true');
        perfilSeleccionado = btn.dataset.perfil;
        // Vista previa en vivo del acento de color según el perfil elegido.
        document.body.classList.remove('role-admin', 'role-empleado');
        document.body.classList.add(perfilSeleccionado === 'admin' ? 'role-admin' : 'role-empleado');
        clearError();
        // Recién ahora se revela el campo de contraseña.
        if (formWrap && formWrap.classList.contains('is-hidden')) {
          formWrap.classList.remove('is-hidden');
          setTimeout(() => {
            const campo = document.getElementById('login-password');
            if (campo) campo.focus();
          }, 260);
        }
      });
    });

    const toggle = document.getElementById('password-toggle');
    const input = document.getElementById('login-password');
    toggle.addEventListener('click', () => {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      toggle.classList.toggle('is-visible-state', isPassword);
    });

    const form = document.getElementById('login-form');
    form.addEventListener('submit', handleSubmit);
    input.addEventListener('input', clearError);
  }

  function clearError() {
    const errorEl = document.getElementById('login-error');
    const field = document.getElementById('password-field');
    errorEl.hidden = true;
    field.classList.remove('has-error');
  }

  function showError(msg) {
    const errorEl = document.getElementById('login-error');
    const field = document.getElementById('password-field');
    errorEl.textContent = msg;
    errorEl.hidden = false;
    field.classList.add('has-error');
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('login-password');
    const submitBtn = document.getElementById('login-submit');
    const password = input.value;
    const cred = getCredenciales()[perfilSeleccionado];

    if (!password) {
      showError('Ingresa tu contraseña para continuar.');
      UI.toast('Ingresa tu contraseña para continuar.', 'warning');
      return;
    }

    submitBtn.classList.add('is-loading');
    submitBtn.disabled = true;

    await new Promise(r => setTimeout(r, 500));

    if (password !== cred.password) {
      submitBtn.classList.remove('is-loading');
      submitBtn.disabled = false;
      showError('Contraseña incorrecta. Verifica e intenta nuevamente.');
      UI.toast('No se pudo iniciar sesión: contraseña incorrecta.', 'error');
      input.value = '';
      input.focus();
      return;
    }

    const session = {
      rol: cred.rol,
      nombre: cred.nombre,
      loginTime: new Date().toISOString()
    };
    DB.setSession(session);
    UI.toast(`Bienvenido, ${cred.nombre}. Sesión iniciada correctamente.`, 'success');

    // Breve transición corporativa antes de mostrar el panel.
    UI.showLoader('Preparando tu panel…');
    await new Promise(r => setTimeout(r, 550));
    UI.hideLoader();

    submitBtn.classList.remove('is-loading');
    App.startSession(session);
  }

  return { render };
})();


/* ==========================================================================
   router.js — Navegación entre vistas dentro del shell de la aplicación
   ========================================================================== */

const Router = (() => {
  let currentView = null;

  const VIEWS = {
    inicio: { render: () => Dashboard.renderInicio(), title: 'Inicio', roles: ['admin', 'empleado'] },
    generar: { render: () => Dashboard.renderGenerar(), title: 'Generar Boletas', roles: ['admin'] },
    resumen: { render: () => Dashboard.renderResumen(), title: 'Resumen', roles: ['admin'] },
    reportes: { render: () => Reportes.render(), title: 'Reportes', roles: ['admin'] },
    configuracion: { render: () => Dashboard.renderConfiguracion(), title: 'Configuración', roles: ['admin'] },
    boletas: { render: () => Dashboard.renderBoletasEmpleado(), title: 'Mis boletas', roles: ['empleado'] }
  };

  function navigate(viewName) {
    const view = VIEWS[viewName];
    const session = DB.getSession();
    if (!view || !session) return;
    if (!view.roles.includes(session.rol)) return;

    currentView = viewName;

    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('is-active', el.dataset.view === viewName);
    });

    const pageTitle = document.getElementById('page-title');
    if (pageTitle) pageTitle.textContent = view.title;

    const main = document.getElementById('main-content');
    main.classList.remove('view-enter');
    main.innerHTML = '<div class="view-skeleton"></div>';

    requestAnimationFrame(() => {
      view.render();
      main.classList.add('view-enter');
    });

    window.location.hash = viewName;
  }

  function getCurrentView() {
    return currentView;
  }

  function init() {
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && VIEWS[hash]) navigate(hash);
    });
  }

  return { navigate, getCurrentView, init, VIEWS };
})();

        if (!grupo) return;

          confirmText: 'Reabrir jornada'

  async function handleGenerar(e) {
    e.preventDefault();
    const fecha = document.getElementById('input-fecha').value;
    const cantidad = parseInt(document.getElementById('input-cantidad').value, 10);
    const codigoInicialRaw = document.getElementById('input-codigo-inicial').value.trim();

    if (!fecha) { UI.toast('Selecciona una fecha válida', 'error'); return; }
    if (!cantidad || cantidad < 1 || cantidad > 500) { UI.toast('Ingresa una cantidad entre 1 y 500', 'error'); return; }
    if (codigoInicialRaw && !/^\d+$/.test(codigoInicialRaw)) {
      UI.toast('El código de la Boleta 1 debe contener solo números (o déjalo en blanco).', 'warning');
      return;
    }

    const gruposExistentes = DB.getGruposPorFecha(fecha);
    const siguienteNombre = DB.siguienteNombreGrupo(fecha);

    if (gruposExistentes.length > 0) {
      const ok = await UI.confirmDialog({
        title: 'Crear un nuevo grupo',
        message: `El ${UI.formatFecha(fecha)} ya tiene ${gruposExistentes.length} ${gruposExistentes.length === 1 ? 'grupo' : 'grupos'} de boletas (${gruposExistentes.map(g => g.nombre).join(', ')}). Se creará "${siguienteNombre}" con ${cantidad} boletas nuevas, sin afectar los grupos existentes.`,
        confirmText: 'Crear grupo'
      });
      if (!ok) return;
    }

    const { grupo } = await UI.withLoader('Generando boletas…', async () => {
      return DB.crearGrupo(fecha, cantidad, codigoInicialRaw || null);
    });

    UI.toast(`Se generó "${grupo.nombre}" con ${cantidad} boletas para el ${UI.formatFecha(fecha)}`, 'success');
    renderGruposLista();
  }

      grupoSeleccionadoResumen = masReciente.id;

  function drawDonut(s) {
    const cont = document.getElementById('donut-chart');
    const total = s.total || 1;
    const segments = [
      { value: s.completas, color: 'var(--color-success)' },
      { value: s.incompletas, color: 'var(--color-warning)' },
      { value: s.sinRegistro, color: 'var(--color-danger)' }
    ];
    const r = 54, c = 2 * Math.PI * r;
    let offset = 0;
    let circles = '';
    segments.forEach(seg => {
      const frac = seg.value / total;
      const len = frac * c;
      circles += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${seg.color}" stroke-width="16"
        stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}" stroke-linecap="butt" class="donut-seg"/>`;
      offset += len;
    });
    cont.innerHTML = `
      <svg viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--color-border)" stroke-width="16"/>
        ${s.total > 0 ? circles : ''}
      </svg>
      <div class="donut-center"><strong>${s.total}</strong><span>Boletas</span></div>
    `;
  }

  function drawBarChart() {
    const cont = document.getElementById('bar-chart');
    const todosLosGrupos = [];
    DB.getFechasDisponibles().slice().sort().forEach(f => {
      DB.getGruposPorFecha(f).forEach(g => todosLosGrupos.push(g));
    });
    const grupos = todosLosGrupos.slice(-7);
    if (grupos.length === 0) {
      cont.innerHTML = `<div class="empty-state empty-state--small"><p>Sin datos históricos.</p></div>`;
      return;
    }
    const datos = grupos.map(g => {
      const b = DB.getBoletasPorGrupo(g.id);
      return { grupo: g, ...stats(b) };
    });
    cont.innerHTML = `
      <div class="bars-row">
        ${datos.map(d => `
          <div class="bar-col">
            <div class="bar-track">
              <div class="bar-fill" style="height:${d.cumplimiento}%" title="${d.cumplimiento}%"></div>
            </div>
            <span class="bar-value">${d.cumplimiento}%</span>
            <span class="bar-label">${UI.formatFecha(d.grupo.fecha)}<br>${d.grupo.nombre}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderTablaGeneral() {
    const cont = document.getElementById('tabla-general');
    let boletas = DB.getBoletasPorGrupo(grupoSeleccionadoResumen);

    if (filtroEstado !== 'todos') boletas = boletas.filter(b => b.estado === filtroEstado);
    if (terminoBusqueda) boletas = boletas.filter(b => String(b.numero).includes(terminoBusqueda));

    boletas = [...boletas].sort((a, b) => {
      let va = a[ordenActual.campo], vb = b[ordenActual.campo];
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return ordenActual.dir === 'asc' ? -1 : 1;
      if (va > vb) return ordenActual.dir === 'asc' ? 1 : -1;
      return 0;
    });

    if (boletas.length === 0) {
      cont.innerHTML = `<div class="empty-state"><span>${icon('empty')}</span><p>No hay boletas que coincidan con la búsqueda.</p></div>`;
      return;
    }

    cont.innerHTML = `

                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;

    cont.querySelectorAll('[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const campo = th.dataset.sort;
        if (ordenActual.campo === campo) ordenActual.dir = ordenActual.dir === 'asc' ? 'desc' : 'asc';
        else ordenActual = { campo, dir: 'asc' };
        renderTablaGeneral();
      });
    });
    cont.querySelectorAll('[data-ver]').forEach(btn => btn.addEventListener('click', () => openRegistro(btn.dataset.ver, { readOnly: true })));
    cont.querySelectorAll('[data-editar]').forEach(btn => btn.addEventListener('click', () => openRegistro(btn.dataset.editar, { readOnly: false })));
    cont.querySelectorAll('[data-eliminar]').forEach(btn => btn.addEventListener('click', async () => {
      const boleta = DB.getBoleta(btn.dataset.eliminar);
      if (!boleta) return;
      const tieneFotos = boleta.estado !== 'sin-registro';
      const ok = await UI.confirmDialog({
        title: 'Eliminar boleta',
        message: `Se eliminará la Boleta ${boleta.numero} del ${UI.formatFecha(boleta.fecha)}.${tieneFotos ? ' Ya tiene fotografías registradas que se perderán permanentemente.' : ''} Esta acción no se puede deshacer.`,
        confirmText: 'Eliminar',
        danger: true
      });
      if (!ok) return;
      await PhotoStore.removeBoleta(boleta.id);
      DB.eliminarBoleta(boleta.id);
      UI.toast(`Boleta ${boleta.numero} eliminada`, 'success');
      renderResumen();
    }));
  }

  function sortIndicator(campo) {
    if (ordenActual.campo !== campo) return '<span class="sort-arrow"></span>';
    return `<span class="sort-arrow is-active">${ordenActual.dir === 'asc' ? '▲' : '▼'}</span>`;
  }

  function handleCambiarContrasenas(e) {
    e.preventDefault();
    const cfg = DB.getConfig();
    const form = document.getElementById('form-config');

    const actual = document.getElementById('cfg-actual').value;
    if (actual !== cfg.passwordAdmin) {
      UI.toast('La contraseña actual de administrador no es correcta.', 'error');
      return;
    }

    const nuevoAdmin = document.getElementById('cfg-nuevo-admin').value;
    const confirmarAdmin = document.getElementById('cfg-confirmar-admin').value;
    const nuevoEmpleado = document.getElementById('cfg-nuevo-empleado').value;
    const confirmarEmpleado = document.getElementById('cfg-confirmar-empleado').value;
    const permitePDF = document.getElementById('cfg-pdf-empleado').checked;

    const cambios = {};

    if (nuevoAdmin || confirmarAdmin) {
      if (nuevoAdmin.length < 6) { UI.toast('La nueva contraseña de administrador debe tener al menos 6 caracteres.', 'warning'); return; }
      if (nuevoAdmin !== confirmarAdmin) { UI.toast('Las contraseñas de administrador no coinciden.', 'warning'); return; }
      cambios.passwordAdmin = nuevoAdmin;
    }

    if (nuevoEmpleado || confirmarEmpleado) {
      if (nuevoEmpleado.length < 6) { UI.toast('La nueva contraseña de colaborador debe tener al menos 6 caracteres.', 'warning'); return; }
      if (nuevoEmpleado !== confirmarEmpleado) { UI.toast('Las contraseñas de colaborador no coinciden.', 'warning'); return; }
      cambios.passwordEmpleado = nuevoEmpleado;
    }

    if (permitePDF !== Boolean(cfg.empleadoPuedeDescargarPDF)) cambios.empleadoPuedeDescargarPDF = permitePDF;

    if (Object.keys(cambios).length === 0) {
      UI.toast('No hay cambios por guardar.', 'info');
      return;
    }

    DB.setConfig(cambios);
    form.reset();
    UI.toast('Contraseña(s) actualizada(s) correctamente.', 'success');
  }

  function renderGruposEmpleado() {
    const cont = document.getElementById('grupos-empleado');
    const hoy = DB.todayISO();
    const permitePDF = DB.getConfig().empleadoPuedeDescargarPDF === true;
    const reportes = DB.getReportes();
    const grupos = DB.getGruposPorFecha(hoy).filter(g => g.visibleEmpleado !== false || (permitePDF && reportes.some(r => r.grupoId === g.id)));

    if (grupos.length === 0) {
      cont.innerHTML = `<div class="empty-state"><span>${icon('empty')}</span><p>Aún no hay boletas disponibles para registrar hoy.</p></div>`;
      return;
    }

    const bloques = grupos.map(g => {
      let boletas = DB.getBoletasPorGrupo(g.id);
      const resumenGrupo = stats(boletas);
      const reporte = reportes.find(r => r.grupoId === g.id);
      const botonPDF = permitePDF
        ? (reporte
            ? `<button class="btn btn-secondary btn-sm" data-descargar-reporte="${reporte.id}">Descargar PDF</button>`
            : `<button class="btn btn-secondary btn-sm" data-descargar-vivo="${g.id}">Descargar PDF</button>`)
        : '';

      if (g.cerrado && permitePDF && reporte) {
        return `<section class="grupo-empleado-block"><div class="grupo-empleado-header"><h3>${g.nombre}</h3><div><span class="grupo-empleado-meta">Jornada cerrada</span>${botonPDF}</div></div></section>`;
      }

      if (filtroEstado !== 'todos') boletas = boletas.filter(b => b.estado === filtroEstado);
      if (terminoBusqueda) boletas = boletas.filter(b => String(b.numero).includes(terminoBusqueda));
      boletas = [...boletas].sort((a, b) => a.numero - b.numero);

      if (boletas.length === 0) return '';

      return `
        <section class="grupo-empleado-block">
          <div class="grupo-empleado-header">
            <h3>${g.nombre}</h3>
            <div>
              <span class="grupo-empleado-meta">${resumenGrupo.completas}/${resumenGrupo.total} completas · ${resumenGrupo.cumplimiento}%</span>
              ${botonPDF}
            </div>
          </div>
          <div class="boleta-grid">
            ${boletas.map(b => boletaCardHTML(b)).join('')}
          </div>
        </section>
      `;
    }).filter(Boolean).join('');

    if (!bloques) {
      cont.innerHTML = `<div class="empty-state"><span>${icon('empty')}</span><p>No hay boletas que coincidan con la búsqueda.</p></div>`;
      return;
    }

    cont.innerHTML = bloques;
    cont.querySelectorAll('[data-descargar-reporte]').forEach(btn => btn.addEventListener('click', () => {
      const reporte = reportes.find(r => r.id === btn.dataset.descargarReporte);
      if (reporte) Reportes.descargarPDF(reporte);
    }));
    cont.querySelectorAll('[data-descargar-vivo]').forEach(btn => btn.addEventListener('click', () => {
      Reportes.descargarPDFDeGrupo(btn.dataset.descargarVivo);
    }));
    cont.querySelectorAll('[data-open-boleta]').forEach(btn => {
      btn.addEventListener('click', () => openRegistro(btn.dataset.openBoleta, { readOnly: false }));
    });
  }

  /* =========================================================
     MODAL DE REGISTRO FOTOGRÁFICO
     ========================================================= */
  async function openRegistro(boletaId, { readOnly = false } = {}) {
    const boleta = DB.getBoleta(boletaId);
    if (!boleta) { UI.toast('La boleta ya no existe', 'error'); return; }

    let fotosState;
    try {
      fotosState = await Promise.all(boleta.fotos.map(f => PhotoStore.preview(f)));
    } catch (error) {
      console.error('No se pudieron recuperar las fotografías', error);
      UI.toast('No se pudieron recuperar algunas fotografías guardadas.', 'warning');
      fotosState = boleta.fotos.map(() => null);
    }
    let cargasActivas = 0;

    const bodyHTML = `
      <div class="registro-header">
        <h4>Boleta ${boleta.numero}</h4>
        <span class="badge" id="registro-badge"></span>
      </div>
      <div class="form-field codigo-boleta-field">
        <label for="input-codigo-boleta">Código de boleta (opcional)</label>
        <input type="text" id="input-codigo-boleta" inputmode="numeric" pattern="[0-9]*" value="${boleta.codigo || ''}" placeholder="Ej. 6000256987" ${readOnly ? 'disabled' : ''} />
      </div>
      <div class="photo-grid">
        ${[0, 1, 2].map(i => photoSlotHTML(i, fotosState[i], readOnly)).join('')}
      </div>
      <p class="registro-hint">${readOnly ? 'Modo de solo lectura.' : 'Arrastra una imagen o haz clic en cada recuadro para seleccionar una fotografía.'}</p>
      ${!readOnly ? `<p class="registro-autosave" id="registro-autosave">${icon('check')} Los cambios se guardan automáticamente.</p>` : ''}
    `;

    const footerHTML = readOnly
      ? `<button class="btn btn-ghost" data-action="cerrar">Cerrar</button>`
      : `<button class="btn btn-primary" data-action="cerrar">Listo</button>`;

    // Advierte antes de cerrar si hay una fotografía cargándose en ese momento,
    // para no perder esa carga en curso (lo ya guardado nunca se pierde).
    const onBeforeClose = async () => {
      if (cargasActivas > 0) {
        return await UI.confirmDialog({
          title: 'Hay una fotografía cargando',
          message: 'Todavía se está procesando una imagen. Si sales ahora, esa carga en curso se perderá (el resto de tu registro ya quedó guardado). ¿Deseas salir de todas formas?',
          confirmText: 'Salir de todas formas',
          cancelText: 'Seguir esperando',
          danger: true
        });
      }
      return true;
    };

    function beforeUnloadHandler(e) {
      if (cargasActivas > 0) { e.preventDefault(); e.returnValue = ''; }
    }
    if (!readOnly) window.addEventListener('beforeunload', beforeUnloadHandler);

    const { overlay, requestClose } = UI.openModal({
      title: `Registro fotográfico`,
      bodyHTML, footerHTML, size: 'lg',
      onBeforeClose,
      onClose: () => {
        window.removeEventListener('beforeunload', beforeUnloadHandler);
        fotosState.forEach(f => { if (f?.data?.startsWith('blob:')) URL.revokeObjectURL(f.data); });
      }
    });

    updateEstadoBadge();

    overlay.querySelectorAll('[data-action="cerrar"]').forEach(b => b.addEventListener('click', requestClose));

    if (!readOnly) {
      [0, 1, 2].forEach(i => wireSlot(overlay, i, boleta));

      const inputCodigo = overlay.querySelector('#input-codigo-boleta');
      let codigoPrevio = boleta.codigo || '';
      inputCodigo.addEventListener('change', () => {
        const valor = inputCodigo.value.trim();
        if (valor && !/^\d+$/.test(valor)) {
          UI.toast('El código debe contener solo números.', 'warning');
          inputCodigo.value = codigoPrevio;
          return;
        }
        if (valor === codigoPrevio) return;
        const resultado = DB.actualizarCodigo(boleta.id, valor);
        if (resultado.ok) {
          codigoPrevio = valor;
          inputCodigo.value = valor;
          mostrarEstadoGuardado();
          refreshCurrentView();
        } else {
          mostrarErrorGuardado();
          inputCodigo.value = codigoPrevio;
        }
      });
    } else {
      [0, 1, 2].forEach(i => {
        const img = overlay.querySelector(`#slot-preview-${i}`);
        if (img && fotosState[i]) {
          img.addEventListener('click', () => openImagePreview(fotosState[i].data));
        }
      });
    }

    function updateEstadoBadge() {
      const estado = DB.calcularEstado(fotosState);
      const meta = ESTADO_META[estado];
      const badge = overlay.querySelector('#registro-badge');
      badge.className = `badge ${meta.className}`;
      badge.textContent = `${meta.dot} ${meta.label}`;
    }

    // Persiste inmediatamente cada cambio (agregar, cambiar o eliminar foto),
    // así nunca se pierde información aunque el usuario cierre el modal,
    // recargue la página o navegue a otra sección.
    function autoguardar() {
      const resultado = DB.actualizarFotos(boleta.id, fotosState.map(PhotoStore.metadata));
      updateEstadoBadge();
      if (resultado.ok) {
        mostrarEstadoGuardado();
      } else {
        mostrarErrorGuardado();
      }
      refreshCurrentView();
      return resultado;
    }

    function mostrarEstadoGuardado() {
      const el = overlay.querySelector('#registro-autosave');
      if (!el) return;
      el.classList.remove('is-error');
      el.classList.add('is-saved');
      el.innerHTML = `${icon('check')} Guardado automáticamente · ${new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' })}`;
      clearTimeout(el._resetTimer);
      el._resetTimer = setTimeout(() => {
        if (!document.body.contains(el)) return;
        el.classList.remove('is-saved');
        el.innerHTML = `${icon('check')} Los cambios se guardan automáticamente.`;
      }, 2600);
    }

    function mostrarErrorGuardado() {
      UI.toast('No se pudo guardar el registro. Verifica el espacio disponible del dispositivo.', 'error', 7000);
      const el = overlay.querySelector('#registro-autosave');
      if (!el) return;
      el.classList.remove('is-saved');
      el.classList.add('is-error');
      clearTimeout(el._resetTimer);
      el.innerHTML = `${icon('warn')} No se pudo guardar el registro.`;
    }

    function wireSlot(overlay, index, boleta) {
      const slot = overlay.querySelector(`#photo-slot-${index}`);
      const input = overlay.querySelector(`#photo-input-${index}`);

      slot.addEventListener('click', (e) => {
        if (e.target.closest('[data-remove-photo]') || e.target.closest('[data-change-photo]') || e.target.closest('[data-zoom-photo]')) return;
        if (!fotosState[index]) { input.click(); }
        else { openImagePreview(fotosState[index].data); }
      });

      const zoomBtn = overlay.querySelector(`[data-zoom-photo="${index}"]`);
      if (zoomBtn) zoomBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (fotosState[index]) openImagePreview(fotosState[index].data);
      });

      const changeBtn = overlay.querySelector(`[data-change-photo="${index}"]`);
      if (changeBtn) changeBtn.addEventListener('click', () => input.click());

      const removeBtn = overlay.querySelector(`[data-remove-photo="${index}"]`);
      if (removeBtn) removeBtn.addEventListener('click', async () => {
        try {
          if (fotosState[index]?.id) await PhotoStore.remove(fotosState[index].id);
          if (fotosState[index]?.data?.startsWith('blob:')) URL.revokeObjectURL(fotosState[index].data);
        } catch (error) {
          UI.toast('No se pudo eliminar la fotografía.', 'error');
          return;
        }
        fotosState[index] = null;
        renderSlot(overlay, index, boleta, readOnly, fotosState, wireSlot, updateEstadoBadge);
        autoguardar();
      });

      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) handleFile(overlay, index, file, boleta, fotosState, updateEstadoBadge, wireSlot, readOnly, onCargaInicio, onCargaFin, autoguardar);
        input.value = '';
      });

      slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.classList.add('is-dragover'); });
      slot.addEventListener('dragleave', () => slot.classList.remove('is-dragover'));
      slot.addEventListener('drop', (e) => {
        e.preventDefault();
        slot.classList.remove('is-dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
          handleFile(overlay, index, file, boleta, fotosState, updateEstadoBadge, wireSlot, readOnly, onCargaInicio, onCargaFin, autoguardar);
        } else {
          UI.toast('Solo se permiten archivos de imagen', 'warning');
        }
      });
    }

    function onCargaInicio() { cargasActivas++; }
    function onCargaFin() { cargasActivas = Math.max(0, cargasActivas - 1); }
  }

  function handleFile(overlay, index, file, boleta, fotosState, updateEstadoBadge, wireSlot, readOnly, onCargaInicio, onCargaFin, autoguardar) {
    if (!file.type.startsWith('image/')) { UI.toast('Solo se permiten archivos de imagen', 'warning'); return; }
    if (file.size > 20 * 1024 * 1024) { UI.toast('La imagen no debe superar 20 MB', 'warning'); return; }

    const slot = overlay.querySelector(`#photo-slot-${index}`);
    slot.classList.add('is-loading');
    slot.innerHTML = slotLoadingHTML();
    onCargaInicio();

    const bar = slot.querySelector('.slot-progress-fill');
    let progress = 0;
    // El progreso avanza mientras la imagen se procesa y se comprime;
    // llega a 100% recién cuando la compresión termina realmente.
    const tick = setInterval(() => {
      progress = Math.min(progress + 9, 88);
      if (bar) bar.style.width = progress + '%';
    }, 70);

    comprimirImagen(file)
      .then(async (blob) => {
        clearInterval(tick);
        if (bar) bar.style.width = '100%';
        try {
          const anterior = fotosState[index];
          const id = `foto-${boleta.id}-${index}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
          await PhotoStore.put({ id, boletaId: boleta.id, name, blob });
          if (anterior?.id) await PhotoStore.remove(anterior.id);
          if (anterior?.data?.startsWith('blob:')) URL.revokeObjectURL(anterior.data);
          fotosState[index] = { id, name, data: URL.createObjectURL(blob) };
          renderSlot(overlay, index, boleta, readOnly, fotosState, wireSlot, updateEstadoBadge);
          onCargaFin();
          autoguardar();
        } catch (err) {
          console.error('Error guardando la imagen', err);
          UI.toast('No se pudo guardar esta imagen en el dispositivo.', 'error');
          onCargaFin();
          renderSlot(overlay, index, boleta, readOnly, fotosState, wireSlot, updateEstadoBadge);
        }
      })
      .catch((err) => {
        clearInterval(tick);
        console.error('Error al procesar la imagen', err);
        UI.toast('No se pudo procesar esta imagen. Intenta con otra foto.', 'error');
        onCargaFin();
        renderSlot(overlay, index, boleta, readOnly, fotosState, wireSlot, updateEstadoBadge);
      });
  }

  /**
   * Comprime y redimensiona una imagen antes de guardarla, para que quepan
   * muchas más fotografías dentro del límite de almacenamiento del navegador
   * en formato Blob JPEG, evitando el sobrepeso de codificar Base64.
   */
  function comprimirImagen(file, maxDimension = 2400, calidad = 0.9) {
    return new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('No se pudo cargar la imagen')); };
      img.onload = () => {
        URL.revokeObjectURL(objectUrl);
        let { width, height } = img;
        if (width > maxDimension || height > maxDimension) {
          if (width >= height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
          else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height); ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('No se pudo comprimir la imagen')), 'image/jpeg', calidad);
      };
      img.src = objectUrl;
    });
  }

  function renderSlot(overlay, index, boleta, readOnly, fotosState, wireSlot, updateEstadoBadge) {
    const slot = overlay.querySelector(`#photo-slot-${index}`);
    slot.outerHTML = photoSlotHTML(index, fotosState[index], readOnly);
    wireSlot(overlay, index, boleta);
  }

  function slotLoadingHTML() {
    return `
      <div class="slot-loading">
        <div class="slot-progress"><div class="slot-progress-fill" style="width:0%"></div></div>
        <p>Cargando imagen…</p>
      </div>
    `;
  }

  function photoSlotHTML(index, foto, readOnly) {
    const num = index + 1;
    if (foto) {
      return `
        <div class="photo-slot photo-slot--filled" id="photo-slot-${index}">
          <img src="${foto.data}" alt="Foto ${num}" class="slot-preview" id="slot-preview-${index}" />
          <span class="slot-check">${ICONS.check}</span>
          <span class="slot-label">Foto ${num}</span>
          ${!readOnly ? `
            <div class="slot-actions">
              <button type="button" class="slot-action-btn" data-zoom-photo="${index}" title="Ver en grande">${ICONS.zoom}</button>
              <button type="button" class="slot-action-btn" data-change-photo="${index}" title="Cambiar imagen">${ICONS.swap}</button>
              <button type="button" class="slot-action-btn slot-action-btn--danger" data-remove-photo="${index}" title="Eliminar imagen">${ICONS.trash}</button>
            </div>
          ` : ''}
          <input type="file" accept="image/*" id="photo-input-${index}" hidden />
        </div>
      `;
    }
    return `
      <div class="photo-slot ${readOnly ? 'photo-slot--disabled' : ''}" id="photo-slot-${index}">
        <span class="slot-upload-icon">${ICONS.upload}</span>
        <span class="slot-label">Foto ${num}</span>
        <span class="slot-hint">${readOnly ? 'Sin imagen' : 'Clic o arrastra'}</span>
        <input type="file" accept="image/*" id="photo-input-${index}" hidden ${readOnly ? 'disabled' : ''} />
      </div>
    `;
  }

  function openImagePreview(dataUrl) {
    const { overlay } = UI.openModal({
      title: 'Vista previa',
      bodyHTML: `
        <div class="image-preview-wrap" id="image-preview-wrap">
          <img src="${dataUrl}" alt="Vista previa" class="image-preview-full" id="image-preview-img" />
        </div>
        <p class="image-preview-hint" id="image-preview-hint">Toca la imagen para acercar · Nivel 0 de 3 (vista completa).</p>
      `,
      size: 'lg'
    });

    const img = overlay.querySelector('#image-preview-img');
    const wrap = overlay.querySelector('#image-preview-wrap');
    const hint = overlay.querySelector('#image-preview-hint');
    // Tres acercamientos progresivos sobre los píxeles originales:
    // detalle (1x), fuerte (3x) y máximo (8x).
    const nivelesZoom = [0, 1, 3, 8];
    let nivelZoom = 0;

    img.addEventListener('click', (e) => {
      const rect = img.getBoundingClientRect();
      // Se recuerda dónde se tocó (en proporción) para centrar el acercamiento
      // justo ahí, y así poder revisar ese detalle de la fotografía.
      const relX = (e.clientX - rect.left) / rect.width;
      const relY = (e.clientY - rect.top) / rect.height;

      nivelZoom = (nivelZoom + 1) % nivelesZoom.length;
      const escala = nivelesZoom[nivelZoom];
      img.classList.toggle('is-zoomed', nivelZoom > 0);
      img.style.cursor = nivelZoom === nivelesZoom.length - 1 ? 'zoom-out' : 'zoom-in';

      if (nivelZoom > 0) {
        requestAnimationFrame(() => {
          // Ancho y alto usan exactamente el mismo factor para evitar distorsión.
          img.style.width = Math.round(img.naturalWidth * escala) + 'px';
          img.style.height = Math.round(img.naturalHeight * escala) + 'px';
          wrap.scrollLeft = Math.max(0, relX * img.scrollWidth - wrap.clientWidth / 2);
          wrap.scrollTop = Math.max(0, relY * img.scrollHeight - wrap.clientHeight / 2);
        });
        hint.textContent = nivelZoom === nivelesZoom.length - 1
          ? `Zoom máximo · Nivel 3 de 3 (${escala}×). Toca para volver a la vista completa.`
          : `Toca para seguir acercando · Nivel ${nivelZoom} de 3 (${escala}×). Desliza para recorrer.`;
      } else {
        img.style.width = '';
        img.style.height = '';
        wrap.scrollTo({ top: 0, left: 0 });
        hint.textContent = 'Toca la imagen para acercar · Nivel 0 de 3 (vista completa).';
      }
    });
  }

  function refreshCurrentView() {
    const view = Router.getCurrentView();
    if (view && Router.VIEWS[view]) Router.VIEWS[view].render();
  }

  return {
    renderInicio, renderGenerar, renderResumen, renderConfiguracion, renderBoletasEmpleado,
    stats, ESTADO_META
  };
})();


/* ==========================================================================
   reportes.js — Cierre de jornada (por grupo de boletas), generación del
   reporte y exportación a PDF (con las fotografías de cada boleta).
   ========================================================================== */

const Reportes = (() => {

  const TITULO_REPORTE = 'Reporte de registro de boletas - Tesalia cbc';
  const SUBTITULO_INFORME = 'Informe automático';
  const BOLETAS_POR_PDF = 25;

  const ESTADO_DOT = { 'completa': '🟢', 'incompleta': '🟡', 'sin-registro': '🔴' };
  const ESTADO_TEXTO = {
    'completa': (n) => `${n} fotos registradas`,
    'incompleta': (n) => `${n} ${n === 1 ? 'foto registrada' : 'fotos registradas'}`,
    'sin-registro': () => 'No registra fotos'
  };

  function render() {
    const main = document.getElementById('main-content');
    const historial = DB.getReportes();

    const todosLosGrupos = [];
    DB.getFechasDisponibles().forEach(f => {
      DB.getGruposPorFecha(f).forEach(g => todosLosGrupos.push(g));
    });
    // Más recientes primero en el selector.
    todosLosGrupos.sort((a, b) => new Date(b.creado) - new Date(a.creado));

    main.innerHTML = `
      <section class="panel-card panel-card--cierre">

          <div>
            <h3>Cierre de jornada</h3>
            <p>Selecciona el grupo de boletas a cerrar. La aplicación revisará automáticamente sus boletas y generará el reporte en PDF. Cada grupo se cierra por separado.</p>
          </div>
        </div>
        ${todosLosGrupos.length === 0 ? `
          <p class="confirm-message">Aún no hay grupos de boletas generados.</p>
        ` : `
          <div class="form-field form-field--inline">
            <label for="select-grupo-cierre">Grupo a cerrar</label>
            <select id="select-grupo-cierre">
              ${todosLosGrupos.map(g => {
                const total = DB.getBoletasPorGrupo(g.id).length;
                return `<option value="${g.id}">${UI.formatFecha(g.fecha)} — ${g.nombre} (${total} boletas)${g.cerrado ? ' · Ya cerrado' : ''}</option>`;
              }).join('')}
            </select>
          </div>
          <button class="btn btn-primary btn-cierre" id="btn-cerrar-jornada">
            <span class="btn-cierre-icon">🔒</span>
            CERRAR JORNADA DEL GRUPO
          </button>
          <button class="btn btn-secondary btn-block btn-descargar-libre" id="btn-descargar-libre">

          </button>
        `}
