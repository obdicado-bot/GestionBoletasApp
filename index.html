      <section class="section-block" id="reporte-resultado"></section>

      <section class="section-block">
        <h3 class="section-title">Historial de reportes</h3>
        <div class="table-wrap" id="historial-reportes"></div>
      </section>
    `;

    const btnCerrar = document.getElementById('btn-cerrar-jornada');
    if (btnCerrar) {
      btnCerrar.addEventListener('click', () => {
        const grupoId = document.getElementById('select-grupo-cierre').value;
        cerrarJornada(grupoId);
      });
    }

    const btnDescargarLibre = document.getElementById('btn-descargar-libre');
    if (btnDescargarLibre) {
      btnDescargarLibre.addEventListener('click', () => {
        const grupoId = document.getElementById('select-grupo-cierre').value;
        descargarPDFSinCerrar(grupoId);
      });
    }

    renderHistorial(historial);
  }

  /** El administrador puede descargar el PDF de un grupo en cualquier
   * momento, sin necesidad de cerrarlo. Si el grupo aún está abierto, se
   * advierte que el reporte reflejará el estado actual (puede estar
   * incompleto) antes de generarlo. Si ya está cerrado, se usa el reporte
   * oficial ya guardado (o se genera uno igual de fiel si no se encuentra). */
  async function descargarPDFSinCerrar(grupoId) {
    const grupo = DB.getGrupo(grupoId);
    if (!grupo) { UI.toast('El grupo ya no existe', 'error'); return; }
    const boletas = DB.getBoletasPorGrupo(grupoId);
    if (boletas.length === 0) { UI.toast('Este grupo no tiene boletas', 'warning'); return; }

    if (!grupo.cerrado) {
      const ok = await UI.confirmDialog({
        title: 'La jornada aún no se ha cerrado',
        message: `"${grupo.nombre}" del ${UI.formatFecha(grupo.fecha)} todavía está abierto. ¿Deseas generar de todas formas un PDF con el estado actual? Puede salir incompleto si aún faltan fotos por registrar.`,
        confirmText: 'Generar PDF incompleto'
      });
      if (!ok) return;
      await descargarPDFDeGrupo(grupoId);
      return;
    }

    const historial = DB.getReportes();
    const reporteExistente = historial.find(r => r.id === grupo.ultimoReporteId) || historial.find(r => r.grupoId === grupoId);
    if (reporteExistente) {
      await generarPDF(reporteExistente);
    } else {
      // El grupo está cerrado pero ya no queda su reporte en el historial
      // (por ejemplo, el admin lo eliminó): se genera uno equivalente al vuelo.
      await descargarPDFDeGrupo(grupoId);
    }
  }

  function generarReporte(grupo) {
    const boletas = DB.getBoletasPorGrupo(grupo.id).sort((a, b) => a.numero - b.numero);
    const s = Dashboard.stats(boletas);

    return {
      id: DB.uid(),
      grupoId: grupo.id,
      grupoNombre: grupo.nombre,
      fecha: grupo.fecha,
      fechaLarga: UI.formatFechaLarga(grupo.fecha),
      titulo: TITULO_REPORTE,
      subtitulo: SUBTITULO_INFORME,
      generadoEn: new Date().toISOString(),
      esperadas: s.total,
      completas: s.completas,
      incompletas: s.incompletas,
      sinRegistro: s.sinRegistro,
      cumplimiento: s.cumplimiento,
      detalle: boletas.map(b => ({
        numero: b.numero,
        codigo: b.codigo || null,
        estado: b.estado,
        cantidadFotos: DB.contarFotos(b.fotos)
      }))
    };
  }

  async function cerrarJornada(grupoId) {
    const grupo = DB.getGrupo(grupoId);
    if (!grupo) return;
    const boletas = DB.getBoletasPorGrupo(grupoId);
    if (boletas.length === 0) {
      UI.toast('Este grupo no tiene boletas', 'warning');
      return;
    }

    const cfg = DB.getConfig();
    const sincronizaSharepoint = Boolean(cfg.sincronizarSharepoint && cfg.sharepointUrl);

    const confirmado = await UI.confirmDialog({
      title: 'Cerrar jornada',
      message: `Se generará el reporte para "${grupo.nombre}" del ${UI.formatFecha(grupo.fecha)}, con ${boletas.length} boletas.${grupo.cerrado ? ' Este grupo ya había sido cerrado antes; se generará un nuevo reporte actualizado.' : ''}${sincronizaSharepoint ? ' También se enviará cada boleta con sus fotos a SharePoint.' : ''} ¿Deseas continuar?`,
      confirmText: 'Cerrar jornada'
    });
    if (!confirmado) return;

    const reporte = await UI.withLoader('Analizando boletas y generando reporte…', async () => {
      const r = generarReporte(grupo);
      DB.guardarReporte(r);
      DB.marcarGrupoCerrado(grupo.id, r.id);
      return r;
    });

    UI.toast('Reporte generado correctamente', 'success');
    mostrarReporte(reporte);
    renderHistorial(DB.getReportes());

    if (sincronizaSharepoint) {
      const resultado = await UI.withLoader('Enviando boletas a SharePoint…', () => SharePointSync.enviarGrupo(grupoId));
      if (resultado.fallidas === 0) {
        UI.toast(`Se enviaron ${resultado.enviadas} boletas a SharePoint correctamente.`, 'success');
      } else {
        UI.toast(`Se enviaron ${resultado.enviadas} de ${resultado.total} boletas a SharePoint. ${resultado.fallidas} fallaron — puedes reintentar desde el historial.`, 'warning');

  }

  function boletaPdfBlockHTML(b) {
    const fotos = b.fotos || [null, null, null];
    // Cuadrícula de 3 columnas: cada fotografía conserva su relación de
    // aspecto original y solo se reduce si supera el espacio disponible.
    const slots = fotos.map(f => f
      ? `<div style="width:100%;display:flex;align-items:flex-start;justify-content:center;"><img src="${f.data}" style="width:auto;height:auto;max-width:100%;max-height:240px;border-radius:8px;border:1px solid #e5e4e2;display:block;" /></div>`
      : `<div style="width:100%;height:150px;border-radius:8px;border:1.5px dashed #d6d4d2;background:#faf9f8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8a8886;text-align:center;">Sin foto</div>`
    ).join('');

    return `
      <div style="border:1px solid #edebe9;border-radius:10px;padding:14px;">
        <p style="margin:0 0 10px;font-size:14px;font-weight:700;">
          ${ESTADO_DOT[b.estado]} Boleta ${b.numero}
          ${b.codigo ? `<span style="font-weight:400;color:#605e5c;font-size:12px;"> · Código ${b.codigo}</span>` : ''}
          <span style="font-weight:400;color:#605e5c;font-size:12px;"> · ${ESTADO_TEXTO[b.estado](b.cantidadFotos)}</span>
        </p>
        <div style="display:grid;grid-template-columns:repeat(3, 1fr);align-items:start;gap:8px;">${slots}</div>
      </div>
    `;
  }

  function esperarImagenes(nodo) {
    const imgs = Array.from(nodo.querySelectorAll('img'));
    return Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }));
  }

  async function renderNodoACanvas(nodo) {
    nodo.style.position = 'fixed';
    nodo.style.left = '-9999px';
    nodo.style.top = '0';
    document.body.appendChild(nodo);
    await esperarImagenes(nodo);
    const canvas = await html2canvas(nodo, { scale: 3, backgroundColor: '#ffffff', useCORS: true, imageTimeout: 30000 });
    document.body.removeChild(nodo);
    return canvas;
  }

  async function generarPDFBlob(reporte) {
    // Se enriquece el detalle con las fotografías reales guardadas en cada boleta.
    const boletasCompletas = reporte.grupoId
      ? DB.getBoletasPorGrupo(reporte.grupoId)
      : DB.getBoletasPorFecha(reporte.fecha);
    const detalleConFotos = await Promise.all(reporte.detalle.map(async d => {
      const boleta = boletasCompletas.find(b => b.numero === d.numero);
      const fotos = boleta ? await Promise.all(boleta.fotos.map(async foto => {
        if (!foto?.id) return null;
        const data = await PhotoStore.dataURL(foto.id);
        return data ? { ...foto, data } : null;
      })) : [null, null, null];
      return { ...d, fotos };
    }));
    const reporteConFotos = { ...reporte, detalle: detalleConFotos };

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const espacioEntreBloques = 3.5; // mm
    let cursorY = 0;

    // Agrega un bloque completo (encabezado, una boleta, o el pie) como imagen
    // en la posición actual. Si no cabe entero en lo que queda de la página,
    // salta a una página nueva ANTES de dibujarlo, para que ninguna
    // fotografía ni tarjeta quede partida entre dos hojas.
    async function agregarBloque(nodo) {
      const canvas = await renderNodoACanvas(nodo);
      const altoMM = (canvas.height * pageWidth) / canvas.width;
      if (cursorY > 0 && cursorY + altoMM > pageHeight) {
        pdf.addPage();
        cursorY = 0;
      }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, cursorY, pageWidth, altoMM, undefined, 'MEDIUM');
      cursorY += altoMM + espacioEntreBloques;
    }

    await agregarBloque(construirNodoEncabezado(reporteConFotos));
    for (const b of reporteConFotos.detalle) {
      await agregarBloque(construirNodoBoletaIndividual(b));
    }
    await agregarBloque(construirNodoPie());

    const blob = pdf.output('blob');
    return { pdf, blob };
  }

  async function generarPDF(reporte) {
    const partes = [];
    for (let i = 0; i < reporte.detalle.length; i += BOLETAS_POR_PDF) {
      partes.push({
        ...reporte,
        detalle: reporte.detalle.slice(i, i + BOLETAS_POR_PDF),
        parte: partes.length + 1
      });
    }
    if (partes.length === 0) partes.push({ ...reporte, parte: 1 });

    await UI.withLoader(`Generando ${partes.length > 1 ? partes.length + ' documentos PDF' : 'documento PDF'}…`, async () => {
      const sufijoGrupo = (reporte.grupoNombre || '').toLowerCase().replace(/\s+/g, '-');
      for (const parte of partes) {
        const { pdf } = await generarPDFBlob(parte);
        const sufijoParte = partes.length > 1 ? `-parte-${parte.parte}-de-${partes.length}` : '';
        pdf.save(`reporte-boletas-${reporte.fecha}${sufijoGrupo ? '-' + sufijoGrupo : ''}${sufijoParte}.pdf`);
      }
    });
    UI.toast(partes.length > 1 ? `${partes.length} PDF generados y descargados` : 'PDF generado y descargado', 'success');
  }

  /** Descarga un PDF con el estado ACTUAL de un grupo, sin necesidad de que
   * la jornada esté cerrada y sin guardar nada en el historial de reportes
   * (es una fotografía del momento, no un cierre formal). Se usa cuando el
   * administrador habilitó el permiso de descarga para los colaboradores. */
  async function descargarPDFDeGrupo(grupoId) {
    const grupo = DB.getGrupo(grupoId);
    if (!grupo) { UI.toast('El grupo ya no existe', 'error'); return; }
    const boletas = DB.getBoletasPorGrupo(grupoId);
    if (boletas.length === 0) { UI.toast('Este grupo no tiene boletas', 'warning'); return; }
    const reporteEnVivo = generarReporte(grupo);
    await generarPDF(reporteEnVivo);
  }

  function renderHistorial(historial) {
    const cont = document.getElementById('historial-reportes');
    if (!cont) return;
    if (historial.length === 0) {
      cont.innerHTML = `<div class="empty-state"><p>Aún no se han cerrado jornadas.</p></div>`;
      return;
    }
    cont.innerHTML = `
      <table class="data-table">
        <thead><tr><th>Fecha</th><th>Grupo</th><th>Esperadas</th><th>Completas</th><th>Cumplimiento</th><th>Generado</th><th></th></tr></thead>
        <tbody>
          ${historial.map(r => `
            <tr>
              <td data-label="Fecha">${UI.formatFecha(r.fecha)}</td>
              <td data-label="Grupo">${r.grupoNombre || 'Grupo 1'}</td>
              <td data-label="Esperadas">${r.esperadas}</td>
              <td data-label="Completas">${r.completas}</td>
              <td data-label="Cumplimiento">${r.cumplimiento}%</td>
              <td data-label="Generado">${new Date(r.generadoEn).toLocaleString('es-EC', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })}</td>
              <td class="cell-actions" data-label="Acciones">
                <button class="icon-btn" data-ver-reporte="${r.id}" title="Ver reporte">${iconEye()}</button>
                <button class="icon-btn" data-reenviar-sharepoint="${r.grupoId || ''}" title="Reenviar boletas a SharePoint">${iconSync()}</button>
                <button class="icon-btn icon-btn--danger" data-eliminar-reporte="${r.id}" title="Eliminar del historial">${iconTrash()}</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <p class="historial-nota">Solo se conservan los últimos 3 reportes generados.</p>
    `;
    cont.querySelectorAll('[data-ver-reporte]').forEach(btn => {
      btn.addEventListener('click', () => {
        const reporte = historial.find(r => r.id === btn.dataset.verReporte);
        if (reporte) mostrarReporte(reporte);
      });
    });
    cont.querySelectorAll('[data-reenviar-sharepoint]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const grupoId = btn.dataset.reenviarSharepoint;
        const cfg = DB.getConfig();
        if (!grupoId) { UI.toast('No se encontró el grupo asociado a este reporte.', 'error'); return; }
        if (!cfg.sharepointUrl) { UI.toast('Configura primero la URL de Power Automate en Configuración.', 'warning'); return; }
        const resultado = await UI.withLoader('Enviando boletas a SharePoint…', () => SharePointSync.enviarGrupo(grupoId));
        if (resultado.fallidas === 0) {
          UI.toast(`Se enviaron ${resultado.enviadas} boletas a SharePoint correctamente.`, 'success');
        } else {
          UI.toast(`Se enviaron ${resultado.enviadas} de ${resultado.total} boletas. ${resultado.fallidas} fallaron.`, 'warning');
        }
      });
    });
    cont.querySelectorAll('[data-eliminar-reporte]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const reporte = historial.find(r => r.id === btn.dataset.eliminarReporte);
        if (!reporte) return;
        const ok = await UI.confirmDialog({
          title: 'Eliminar reporte',
          message: `Se eliminará del historial el reporte de "${reporte.grupoNombre || 'Grupo 1'}" (${UI.formatFecha(reporte.fecha)}). El PDF ya descargado no se ve afectado. Esta acción no se puede deshacer.`,
          confirmText: 'Eliminar',
          danger: true
        });
        if (!ok) return;
        DB.eliminarReporte(reporte.id);
        UI.toast('Reporte eliminado del historial', 'success');
        renderHistorial(DB.getReportes());
      });
    });
  }

  function iconEye() { return '<svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M1.7 10S4.6 4.5 10 4.5 18.3 10 18.3 10 15.4 15.5 10 15.5 1.7 10 1.7 10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.5"/></svg>'; }
  function iconTrash() { return '<svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4.5 6h11M8 6V4.5a1 1 0 011-1h2a1 1 0 011 1V6M6 6l.6 9a1 1 0 001 .9h4.8a1 1 0 001-.9l.6-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconSync() { return '<svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4 9a6 6 0 0110.5-3.8M16 4v3.5h-3.5M16 11a6 6 0 01-10.5 3.8M4 16v-3.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function iconDownload() { return '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" style="vertical-align:-3px;margin-right:2px;"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14.5v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; }

  return { render, descargarPDF: generarPDF, descargarPDFDeGrupo };
})();


/* ==========================================================================
   app.js — Punto de entrada, control de sesión y shell de la aplicación
   ========================================================================== */

const App = (() => {

  const NAV_ADMIN = [
    { view: 'inicio', label: 'Inicio', icon: navIcon('home') },
    { view: 'generar', label: 'Generar Boletas', icon: navIcon('camera') },
    { view: 'resumen', label: 'Resumen', icon: navIcon('chart') },
    { view: 'reportes', label: 'Reportes', icon: navIcon('report') },
    { view: 'configuracion', label: 'Configuración', icon: navIcon('gear') }
  ];

  const NAV_EMPLEADO = [
    { view: 'inicio', label: 'Inicio', icon: navIcon('home') },
    { view: 'boletas', label: 'Mis boletas', icon: navIcon('camera') }
  ];

  function navIcon(name) {
    const icons = {
      home: '<path d="M3 9.5L10 3l7 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8.5V16a1 1 0 001 1h8a1 1 0 001-1V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
      camera: '<path d="M3 7.5a1.5 1.5 0 011.5-1.5h1l.8-1.3a1 1 0 01.85-.5h3.7a1 1 0 01.85.5l.8 1.3h1A1.5 1.5 0 0115 7.5v6A1.5 1.5 0 0113.5 15h-9A1.5 1.5 0 013 13.5v-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="10.2" r="2.3" stroke="currentColor" stroke-width="1.4"/>',
      chart: '<path d="M3 17V9M9 17V3M15 17v-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
      report: '<path d="M5 2.5h7l3 3V17a1 1 0 01-1 1H5a1 1 0 01-1-1V3.5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 9h6M7 12h6M7 6h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
      gear: '<circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5.1 5.1l1.4 1.4M13.5 13.5l1.4 1.4M5.1 14.9l1.4-1.4M13.5 6.5l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
    };
    return `<svg viewBox="0 0 20 20" fill="none">${icons[name]}</svg>`;
  }

  function init() {
    // Pantalla de bienvenida corporativa mientras se prepara la aplicación.
    const inicioMinimo = new Promise(resolve => setTimeout(resolve, 1000));

    DB.seedIfEmpty();
    Router.init();

    // Por seguridad, cada vez que se abre la aplicación (nueva pestaña,
    // recarga, o volver a entrar desde el ícono del teléfono) se pide la
    // contraseña de nuevo — no se reanuda automáticamente una sesión
    // anterior. Así nadie ve información de "el último usuario" sin
    // autenticarse primero.
    DB.clearSession();

    Promise.all([inicioMinimo, PhotoStore.open(), PhotoStore.migrarFotosAntiguas()]).catch(error => {
      console.error('IndexedDB no está disponible', error);
      UI.toast('No se pudo preparar el almacenamiento de fotografías.', 'warning');
    }).then(() => {
      ocultarSplash();
      showLogin();
    });
  }

  function ocultarSplash() {
    const splash = document.getElementById('splash-screen');
    if (!splash) return;
    splash.classList.add('is-hidden');
    setTimeout(() => splash.remove(), 450);
  }

  function showLogin() {
    document.body.classList.remove('role-admin', 'role-empleado');
    document.getElementById('login-screen').hidden = false;
    document.getElementById('app-shell').hidden = true;
    Login.render();
  }

  function startSession(session) {
    document.body.classList.remove('role-admin', 'role-empleado');
    document.body.classList.add(session.rol === 'admin' ? 'role-admin' : 'role-empleado');
    document.getElementById('login-screen').hidden = true;
    document.getElementById('app-shell').hidden = false;
    renderShell(session);
    const initial = window.location.hash.replace('#', '');
    const nav = session.rol === 'admin' ? NAV_ADMIN : NAV_EMPLEADO;
    const validInitial = nav.some(n => n.view === initial);
    Router.navigate(validInitial ? initial : nav[0].view);
  }

  function renderShell(session) {
    const nav = session.rol === 'admin' ? NAV_ADMIN : NAV_EMPLEADO;
    const shell = document.getElementById('app-shell');
    shell.innerHTML = `
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark brand-mark--sm">
            <svg viewBox="0 0 40 40" fill="none">
              <rect x="4" y="4" width="14" height="14" rx="3" fill="#0F6CBD"/>
              <rect x="22" y="4" width="14" height="14" rx="3" fill="#50E6FF"/>
              <rect x="4" y="22" width="14" height="14" rx="3" fill="#50E6FF"/>
              <rect x="22" y="22" width="14" height="14" rx="3" fill="#0F6CBD"/>
            </svg>
          </span>
          <span class="brand-text">Control de Boletas</span>
        </div>
        <nav class="sidebar-nav">
          ${nav.map(item => `
            <button class="nav-item" data-view="${item.view}">
              <span class="nav-icon">${item.icon}</span>
              <span class="nav-label">${item.label}</span>
            </button>
          `).join('')}
        </nav>
        <button class="nav-item nav-item--logout" id="btn-logout">
          <span class="nav-icon"><svg viewBox="0 0 20 20" fill="none"><path d="M8 17H4.5a1 1 0 01-1-1V4a1 1 0 011-1H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 13.5L16 10l-3.5-3.5M16 10H7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="nav-label">Cerrar sesión</span>
        </button>
      </aside>

      <div class="shell-main">
        <header class="topbar">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Alternar menú">
            <svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <h1 id="page-title">Inicio</h1>
          <div class="topbar-right">
            <span class="topbar-date">${UI.formatFecha(DB.todayISO())}</span>
            <div class="user-chip">
              <span class="user-avatar">${session.nombre.charAt(0)}</span>
              <div class="user-info">
                <strong>${session.nombre}</strong>
                <small>${session.rol === 'admin' ? 'Administrador' : 'Colaborador'}</small>
              </div>
            </div>
            <button class="topbar-logout" id="btn-logout-mobile" aria-label="Cerrar sesión">
              <svg viewBox="0 0 20 20" fill="none"><path d="M8 17H4.5a1 1 0 01-1-1V4a1 1 0 011-1H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 13.5L16 10l-3.5-3.5M16 10H7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </header>
        <main class="main-content" id="main-content"></main>
        <nav class="bottom-nav" id="bottom-nav">
          ${nav.map(item => `
            <button class="nav-item bottom-nav-item" data-view="${item.view}">
              <span class="nav-icon">${item.icon}</span>
              <span class="nav-label">${item.label}</span>
            </button>
          `).join('')}
        </nav>
      </div>
    `;

    shell.querySelectorAll('.nav-item[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        Router.navigate(btn.dataset.view);
        document.getElementById('sidebar').classList.remove('is-open');
      });
    });

    document.getElementById('btn-logout').addEventListener('click', handleLogout);
    document.getElementById('btn-logout-mobile').addEventListener('click', handleLogout);
    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('is-open');
    });
  }

  async function handleLogout() {
    const ok = await UI.confirmDialog({
      title: 'Cerrar sesión',
      message: '¿Seguro que deseas cerrar la sesión actual?',
      confirmText: 'Cerrar sesión'
    });
    if (!ok) return;
    DB.clearSession();
    UI.toast('Sesión cerrada', 'info');
    window.location.hash = '';
    showLogin();
  }

  return { init, startSession };
})();

document.addEventListener('DOMContentLoaded', () => {
  App.init();
});

  </script>
</body>
